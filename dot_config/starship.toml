add_newline = false
command_timeout = 200

format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #E78284)"
success_symbol = "[❯](bold #8EA5FF)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold #8EA5FF"
repo_root_style = "bold #B6A0FF"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #B6A0FF"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "#E5C890"

ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = ""
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
